<!-- Supermenu: paste all of this into one Squarespace Code block (Code block settings: HTML, "Display source" off).
     Change SITE to the address Netlify gives the Supermenu site, with no slash at the end. -->
<iframe id="supermenu-frame" title="Supermenu" src="https://supermenu-ars.netlify.app/"
  style="display:block;width:100%;height:1200px;border:0;overflow:hidden" scrolling="no"
  allow="clipboard-write"></iframe>
<script>
(function(){
  var SITE='https://supermenu-ars.netlify.app';
  var frame=document.getElementById('supermenu-frame');
  frame.src=SITE+'/';
  window.addEventListener('message',function(e){
    if(e.origin!==SITE||!e.data||!e.data.supermenu)return;
    if(typeof e.data.h==='number')frame.style.height=e.data.h+'px';
    if(typeof e.data.y==='number'){
      var top=frame.getBoundingClientRect().top+window.pageYOffset+e.data.y-12;
      window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    }
  });
})();
</script>
