<title>Supermenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a pink vitrine of numbered objects, a tray of three, and the answer as an A4 sheet.
   One visual world (the series colours), so a single light theme, every colour set explicitly. */
:root{
  --ground:#FFFFFF;      /* page */
  --case:#FFCCCC;        /* the vitrine, the series pink */
  --ink:#000033;         /* navy: all text and line */
  --mark:#FF5E39;        /* orange: only what you have chosen */
  --rule:#CCCCCC;        /* grey: shading, borders */
  --sheet:#FFFFFF;
  --soft:#5A5A73;        /* navy at reading weight for secondary text */
  --f-num:"VT323",ui-monospace,"Courier New",monospace;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-text);font-size:15px;line-height:1.5}
.wrap>*{min-width:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-num);font-weight:400;font-size:clamp(48px,9vw,84px);line-height:.85;margin:0;letter-spacing:.01em}
.lede{margin:8px 0 0;max-width:40ch;color:var(--ink)}
.lang{display:flex;gap:4px;font-family:var(--f-num);font-size:20px}
.lang button{background:none;border:1px solid var(--rule);color:var(--soft);padding:2px 10px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

/* the vitrine */
.case{background:var(--case);padding:14px;display:grid;gap:10px}
.case-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-num);font-size:20px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.obj{position:relative;aspect-ratio:3/4;max-width:100%;border:1px solid transparent;background:transparent;padding:10px 8px 26px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;transition:background .15s,border-color .15s}
.obj img{max-height:100%;max-width:100%;object-fit:contain;filter:grayscale(1) contrast(1.05);mix-blend-mode:multiply;transition:transform .2s}
.obj:hover{border-color:rgba(0,0,51,.25)}
.obj:hover img{transform:translateY(-3px)}
.obj:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.obj .no{position:absolute;left:6px;bottom:4px;font-family:var(--f-num);font-size:19px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.obj .pick{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--mark);color:var(--ground);font-family:var(--f-num);font-size:20px;line-height:26px;text-align:center}
.obj[aria-pressed="true"]{border-color:var(--mark);background:rgba(255,255,255,.45)}
.obj[aria-pressed="true"] .no{color:var(--mark)}
.obj[disabled]{cursor:default}
.obj[disabled] img{opacity:.45}

/* the tray */
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.slots{display:flex;gap:8px;padding-bottom:18px}
.slot{width:64px;height:80px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:22px;color:var(--soft);position:relative;background:var(--ground)}
.slot img{max-width:84%;max-height:84%;object-fit:contain;filter:grayscale(1)}
.slot.full{border:1px solid var(--mark)}
.slot.full::after{content:attr(data-no);position:absolute;bottom:-18px;left:0;font-size:16px;color:var(--mark)}
.tray .count{color:var(--soft);min-width:9ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--f-text);font-size:15px;font-weight:500;padding:10px 16px;border:1px solid var(--ink);background:var(--ground);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--ground)}
.btn.primary[disabled]{background:var(--rule);border-color:var(--rule);color:var(--ground);cursor:default}
.btn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.btn.quiet{border-color:var(--rule)}

/* the answer: an A4 sheet */
.answer{display:grid;justify-items:center;gap:14px;background:var(--rule);padding:28px 16px}
.sheet{background:var(--sheet);width:min(100%,520px);aspect-ratio:210/297;max-width:100%;padding:6% 7%;display:grid;grid-template-rows:auto auto 1fr auto;gap:clamp(10px,2.6vw,18px);box-shadow:0 1px 0 rgba(0,0,51,.15),0 10px 30px rgba(0,0,51,.12)}
.sheet-top{display:flex;flex-wrap:wrap;white-space:nowrap;justify-content:space-between;gap:8px;font-family:var(--f-num);font-size:clamp(15px,3.6vw,20px);line-height:1;border-bottom:1px solid var(--ink);padding-bottom:8px}
.task{font-family:var(--f-text);font-weight:600;font-size:clamp(19px,4.6vw,30px);line-height:1.18;letter-spacing:-.01em;text-wrap:balance;margin:0}
.space{border:1.5px solid var(--ink);min-height:0}
.sheet-foot{display:grid;gap:8px}
.ticks{display:flex;flex-wrap:wrap;gap:8px 22px}
.done{display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:clamp(17px,4vw,22px);line-height:1;white-space:nowrap}
.tick{width:clamp(20px,4.6vw,28px);aspect-ratio:1;border:1.5px solid var(--ink);display:inline-block}
.return{overflow-wrap:anywhere;font-size:clamp(10px,2.3vw,12.5px);line-height:1.4;margin:0;color:var(--ink)}
.return b{white-space:nowrap;font-family:var(--f-num);font-weight:400;font-size:1.35em;letter-spacing:.02em}
.chosen{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--rule);padding-top:6px}
.chosen figure{margin:0;display:grid;justify-items:center;gap:2px}
.chosen img{height:clamp(28px,7vw,44px);width:auto;max-width:72px;object-fit:contain;filter:grayscale(1)}
.chosen figcaption{font-family:var(--f-num);font-size:14px;line-height:1}
.sheet-note{font-size:13px;color:var(--soft);margin:0;text-align:center}
.after{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.toast{min-height:1.5em;color:var(--ink);font-size:14px;margin:0}
footer{font-size:12.5px;color:var(--soft);max-width:70ch;border-top:1px solid var(--rule);padding-top:12px}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .wrap{display:block;padding:0;max-width:none}
  .wrap>*:not(.answer),.answer>*:not(.sheet){display:none!important}
  .answer{display:block;padding:0;background:none}
  .sheet{width:210mm;height:296mm;break-inside:avoid;aspect-ratio:auto;max-width:none;padding:16mm 16mm 14mm;box-shadow:none;animation:none;gap:7mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet-top{font-size:15pt}
  .task{font-size:26pt}
  .done{font-size:16pt}
  .tick{width:8mm}
  .return{font-size:10pt}
  .chosen img{height:16mm;max-width:24mm}
  .chosen figcaption{font-size:12pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sheet.enter{animation:rise .45s ease-out}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Supermenu</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-lang="en">EN</button>
      <button type="button" id="lang-es" data-lang="es">ES</button>
    </div>
  </header>

  <section class="case" aria-labelledby="case-label">
    <div class="case-head"><span id="case-label"></span><span id="case-set"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="tray" aria-live="polite">
    <div class="slots" id="slots"></div>
    <span class="count" id="count"></span>
    <div class="actions">
      <button type="button" class="btn primary" id="go" disabled></button>
      <button type="button" class="btn quiet" id="reshuffle"></button>
    </div>
  </section>

  <section class="answer" id="answer" hidden>
    <article class="sheet" id="sheet">
      <div class="sheet-top"><span id="sheet-label">Supermenu</span><span id="sheet-code"></span><span id="sheet-date"></span></div>
      <p class="task" id="task"></p>
      <div class="space" aria-hidden="true"></div>
      <div class="sheet-foot">
        <div class="ticks"><div class="done"><span class="tick" aria-hidden="true"></span><span id="done-label"></span></div><div class="done"><span class="tick" aria-hidden="true"></span><span id="nfm-label"></span></div></div>
        <p class="return" id="return"></p>
        <div class="chosen" id="chosen"></div>
      </div>
    </article>
    <p class="sheet-note" id="sheet-note"></p>
    <div class="after">
      <button type="button" class="btn primary" id="print" hidden></button>
      <button type="button" class="btn" id="copy"></button>
      <button type="button" class="btn" id="next"></button>
      <button type="button" class="btn quiet" id="again"></button>
    </div>
    <p class="toast" id="toast" role="status"></p>
  </section>

  <footer id="credits"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const PRINT=false; // the site build turns this on; the hosted preview cannot print
const SHOW=12, PICKS=3, TAG='#supermenuARS';
// a short code for each sheet, so it can be marked done later (no confusable letters)
/*__CODEC__*/

const WORDS={
 en:{lede:'Pick three objects from the case. The machine answers with one thing to do.',
     case:'The case',set:n=>`Set ${n}`,count:n=>`${n} of 3 chosen`,go:'Show my task',reshuffle:'Another set of objects',
     copy:'Copy the task',copied:'Copied.',copyFail:'Select the task text to copy it.',next:'Another task',again:'Start again',
     note:'Do it in the box, in your own time. Nothing you pick is kept.',print:'Print the sheet',done:'Done',nfm:'Not for me',ret:(c,tag)=>`Tick a box. If you like, post a photo of the sheet with <b>${tag}</b>. Share only what you are happy to show.`,of:(i,n)=>`${i} of ${n}`,
     credits:'Objects photographed in UK museum collections, gathered for the COSMORAMA Supermenu (2017). Images from the British Museum: © The Trustees of the British Museum, shared under CC BY-NC-SA 4.0. Full object credits to follow.',
     pickLabel:(no,on)=>`Object ${no}${on?', chosen':''}`},
 es:{lede:'Elige tres objetos de la vitrina. La máquina te responde con una cosa por hacer.',
     case:'La vitrina',set:n=>`Serie ${n}`,count:n=>`${n} de 3 elegidos`,go:'Ver mi tarea',reshuffle:'Otros objetos',
     copy:'Copiar la tarea',copied:'Copiada.',copyFail:'Selecciona el texto de la tarea para copiarlo.',next:'Otra tarea',again:'Empezar de nuevo',
     note:'Hazla en el recuadro, a tu ritmo. No se guarda nada de lo que eliges.',print:'Imprimir la hoja',done:'Hecha',nfm:'No es para mí',ret:(c,tag)=>`Marca una casilla. Si quieres, publica una foto de la hoja con <b>${tag}</b>. Comparte solo lo que quieras mostrar.`,of:(i,n)=>`${i} de ${n}`,
     credits:'Objetos fotografiados en colecciones de museos del Reino Unido, reunidos para el Supermenu de COSMORAMA (2017). Imágenes del British Museum: © The Trustees of the British Museum, bajo licencia CC BY-NC-SA 4.0. Créditos completos por venir.',
     pickLabel:(no,on)=>`Objeto ${no}${on?', elegido':''}`}
};
let lang=(()=>{try{const v=localStorage.getItem('supermenu.lang');if(v==='en'||v==='es')return v}catch(e){}return /^es\b/i.test(navigator.language||'')?'es':'en'})();
const W=()=>WORDS[lang];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(3,'0');
const OBJ=Object.fromEntries(D.objects.map(o=>[o.id,o]));

// seeded shuffle, so a set can be named and redrawn
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* The engine. Each object carries one operation; each task carries a chain of them.
   A task scores, for each object picked, its closest operation: the same one counts in full,
   a neighbour on the operations map counts in part, more if it shares a family.
   Nothing about the picker is used, only the objects. */
function sim(a,b){
  if(a===b)return 1;const A=D.ops[a],B=D.ops[b];if(!A||!B)return 0;
  const d=Math.hypot(A.xy[0]-B.xy[0],A.xy[1]-B.xy[1]);
  return Math.exp(-d/1.5)*.6+(A.cat===B.cat?.15:0);
}
function rank(ids){
  const picked=ids.map(id=>OBJ[id].op);
  const salt=ids.slice().sort((a,b)=>a-b).reduce((h,x)=>(h*31+x)>>>0,7);
  return D.tasks.map(t=>({t,s:picked.reduce((sum,p)=>sum+Math.max(...t.chain.map(c=>sim(p,c))),0),tie:((t.n*2654435761)^salt)>>>0}))
    .sort((a,b)=>b.s-a.s||a.tie-b.tie).map(x=>x.t);
}
// For later (stored picks): one place where a finished choice could be recorded. Nothing is kept now.
function recordPicks(ids,taskN){/* intentionally empty in this version */}

const S={setNo:1,seed:0,shown:[],picks:[],ranked:[],at:0,code:''};
/* Embedded on another page (Squarespace): tell that page how tall this one is, so it shows no scroll bar
   of its own, and ask it to scroll when the sheet appears. See embed.html for the other half. */
const EMBED=PRINT&&(()=>{try{return window.self!==window.top}catch(e){return true}})(); // only the site build talks to its host page
function tellParent(msg){if(EMBED)try{parent.postMessage(Object.assign({supermenu:true},msg),'*')}catch(e){}}
if(EMBED){const send=()=>tellParent({h:Math.ceil(document.body.getBoundingClientRect().height)});
  try{new ResizeObserver(send).observe(document.body)}catch(e){setInterval(send,800)}window.addEventListener('load',send)}
function goTo(el){
  const smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  if(EMBED)tellParent({y:el?Math.round(el.getBoundingClientRect().top+window.scrollY):0});
  else if(el)el.scrollIntoView({behavior:smooth,block:'start'});else window.scrollTo({top:0});
}
// A sheet can be reopened from its code (#SM-XXXX), which is how printing works from inside an embed
function openFromCode(code){
  const r=decodeSheet(code);if(!r||!r.objects.every(id=>OBJ[id]))return false;
  S.picks=r.objects.slice();const rest=S.shown.filter(id=>!S.picks.includes(id));S.shown=[...S.picks,...rest].slice(0,SHOW);
  S.ranked=rank(S.picks);S.at=Math.max(0,S.ranked.findIndex(t=>t.n===r.task));S.code=encodeSheet(S.picks,S.ranked[S.at].n);
  $('answer').hidden=false;return true;
}
function newSet(){
  S.seed=(crypto.getRandomValues(new Uint32Array(1))[0])||Date.now();
  S.shown=shuffle(D.objects.map(o=>o.id),rng(S.seed)).slice(0,SHOW);
  S.picks=S.picks.filter(id=>S.shown.includes(id));
}

function renderGrid(){
  const g=$('grid');g.textContent='';
  for(const id of S.shown){
    const o=OBJ[id],i=S.picks.indexOf(id),on=i>=0,full=S.picks.length>=PICKS&&!on;
    const b=document.createElement('button');b.type='button';b.className='obj';b.id='obj-'+id;
    b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',W().pickLabel(pad(id),on));if(full)b.disabled=true;
    const img=document.createElement('img');img.src=o.img;img.alt='';img.decoding='async';b.append(img);
    const no=document.createElement('span');no.className='no';no.textContent=pad(id);b.append(no);
    if(on){const p=document.createElement('span');p.className='pick';p.textContent=i+1;b.append(p)}
    b.addEventListener('click',()=>toggle(id));g.append(b);
  }
}
function renderTray(){
  const s=$('slots');s.textContent='';
  for(let i=0;i<PICKS;i++){
    const id=S.picks[i],d=document.createElement('div');d.className='slot'+(id?' full':'');
    if(id){const img=document.createElement('img');img.src=OBJ[id].img;img.alt='';d.append(img);d.dataset.no=pad(id)}else d.textContent=i+1;
    s.append(d);
  }
  $('count').textContent=W().count(S.picks.length);
  $('go').disabled=S.picks.length<PICKS;
}
function renderWords(){
  document.documentElement.lang=lang==='es'?'es-MX':'en-GB';
  $('lede').textContent=W().lede;$('case-label').textContent=W().case;$('case-set').textContent=W().set(S.setNo);
  $('go').textContent=W().go;$('reshuffle').textContent=W().reshuffle;$('copy').textContent=W().copy;$('print').textContent=W().print;$('print').hidden=!PRINT;
  $('next').textContent=W().next;$('again').textContent=W().again;$('sheet-note').textContent=W().note;$('credits').textContent=W().credits;
  for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',b.dataset.lang===lang);
}
function renderSheet(animate){
  const t=S.ranked[S.at];if(!t)return;
  $('task').textContent=t[lang];
  $('sheet-code').textContent=S.code;$('done-label').textContent=W().done;$('nfm-label').textContent=W().nfm;
  $('return').innerHTML=W().ret(S.code,TAG);
  $('sheet-date').textContent=new Date().toLocaleDateString(lang==='es'?'es-MX':'en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
  const c=$('chosen');c.textContent='';
  for(const id of S.picks){const f=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');
    img.src=OBJ[id].img;img.alt='';cap.textContent=pad(id);f.append(img,cap);c.append(f)}
  const sh=$('sheet');if(animate){sh.classList.remove('enter');void sh.offsetWidth;sh.classList.add('enter')}
  $('toast').textContent='';
}
function renderAll(){renderWords();renderGrid();renderTray();if(!$('answer').hidden)renderSheet(false)}

function toggle(id){
  const i=S.picks.indexOf(id);
  if(i>=0)S.picks.splice(i,1);else if(S.picks.length<PICKS)S.picks.push(id);
  if(!$('answer').hidden&&S.picks.length<PICKS)$('answer').hidden=true;
  renderGrid();renderTray();
}
$('go').addEventListener('click',()=>{
  if(S.picks.length<PICKS)return;
  S.ranked=rank(S.picks);S.at=0;S.code=encodeSheet(S.picks,S.ranked[0].n);recordPicks(S.picks,S.ranked[0].n);
  $('answer').hidden=false;renderSheet(true);
  goTo($('answer'));
});
$('print').addEventListener('click',()=>{
  if(EMBED){const u=location.origin+location.pathname+'?print#'+S.code;const w=window.open(u,'_blank');if(!w)location.href=u}
  else window.print();
});
$('next').addEventListener('click',()=>{S.at=(S.at+1)%S.ranked.length;S.code=encodeSheet(S.picks,S.ranked[S.at].n);renderSheet(true)});
$('again').addEventListener('click',()=>{S.picks=[];S.setNo++;newSet();$('answer').hidden=true;renderAll();goTo(null)});
$('reshuffle').addEventListener('click',()=>{S.setNo++;newSet();$('answer').hidden=true;renderAll()});
$('copy').addEventListener('click',()=>{
  const text=$('task').textContent;
  try{navigator.clipboard.writeText(text).then(()=>{$('toast').textContent=W().copied},()=>fallback())}catch(e){fallback()}
  function fallback(){const r=document.createRange();r.selectNodeContents($('task'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('toast').textContent=W().copyFail}
});
for(const b of document.querySelectorAll('.lang button'))b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('supermenu.lang',lang)}catch(e){}renderAll()});

newSet();
const fromCode=/^#SM-[A-Z0-9]{4}$/i.test(location.hash)&&openFromCode(location.hash.slice(1));
renderAll();
if(fromCode){if(/[?&]print\b/.test(location.search)&&PRINT&&!EMBED)setTimeout(()=>window.print(),600);else goTo($('answer'))}
})();
</script>
